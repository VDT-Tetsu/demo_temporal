# Phuong an 1: Temporal server + PostgreSQL + Temporal UI
#   docker compose up -d
# Bien cau hinh doc tu file .env (xem .env.example)
services:
  postgresql:
    image: postgres:${POSTGRES_VERSION:-16}
    container_name: temporal-postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temporal}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-temporal}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:${TEMPORAL_SERVER_VERSION:-1.29.7}
    container_name: temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-temporal}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-temporal}
      - POSTGRES_SEEDS=postgresql
      # Retention cua namespace default, chi ap dung khi namespace duoc tao lan dau
      - DEFAULT_NAMESPACE_RETENTION=${TEMPORAL_RETENTION:-168h}
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.57.0}
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "${TEMPORAL_UI_PORT:-8080}:8080"

volumes:
  temporal-postgres-data:
